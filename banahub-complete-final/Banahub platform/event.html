<!DOCTYPE html>
<html lang="en" class="light">

<head>
  <meta charset="utf-8" />
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="BANAHUB Events — Capital, Growth and Market Access forums, summits, and roundtables connecting investible businesses with investors across Singapore, ASEAN, the Gulf, and beyond." />
  <meta property="og:title" content="Events | BANAHUB" />
  <meta property="og:description" content="Capital and Growth Exchange forums, summits, and roundtables." />
  <meta property="og:url" content="https://www.banahub.com/event" />
  <meta property="og:type" content="website" />
  <link rel="canonical" href="https://www.banahub.com/event" />
  <title>Event | BANAHUB</title>

  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="512x512" href="logo-icon-512.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <link rel="stylesheet" href="./output.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Manrope:wght@300;400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@400,0&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="glass-theme.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Manrope', system-ui, sans-serif; }
    .glass { background: rgba(250,249,245,.72); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(191,201,195,.3); }
    .font-display { font-family: 'Newsreader', Georgia, serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
    .ev-card { transition: transform .2s ease, box-shadow .2s ease; }
    .ev-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,53,39,.12); }
    .skyline-mark { background: linear-gradient(135deg, #003527 0%, #262e42 100%); }
  </style>
</head>

<body class="bg-background text-on-surface antialiased">
  <div class="glass-bg-layer"></div>

  <!-- NAV (same as index.html) -->
  <div id="site-nav"></div>

  <main data-cms-skip>
    <div id="ev-loading" class="py-32 text-center text-on-surface-variant font-sans">Loading event…</div>
    <div id="ev-missing" class="hidden py-32 text-center px-10">
      <h1 class="font-display font-semibold text-display-sm text-primary mb-4">Event not found</h1>
      <p class="font-sans text-body-lg text-on-surface-variant mb-8">This event may have ended or is not yet published.</p>
      <a href="events.html" class="bg-primary text-on-primary px-6 py-3 rounded font-sans font-semibold">All events</a>
    </div>
    <article id="ev" class="hidden">
      <section id="ev-hero" class="relative skyline-mark text-white">
        <img id="ev-cover" alt="" class="absolute inset-0 w-full h-full object-cover opacity-40 hidden"/>
        <div class="relative z-10 px-6 md:px-10 py-20 md:py-28 max-w-container-max mx-auto">
          <a href="events.html" class="inline-flex items-center gap-1 font-sans text-body-sm opacity-80 hover:opacity-100 mb-6"><span class="material-symbols-outlined text-[18px]">arrow_back</span>All events</a>
          <p id="ev-eyebrow" class="font-sans font-bold text-label-caps tracking-widest mb-3"></p>
          <h1 id="ev-title" class="font-display font-semibold text-display-sm md:text-display-md leading-tight mb-5 max-w-3xl"></h1>
          <p id="ev-when" class="font-sans text-body-lg opacity-90"></p>
          <div id="ev-cta" class="flex flex-wrap gap-3 mt-8"></div>
        </div>
      </section>
      <section class="px-6 md:px-10 max-w-container-max mx-auto py-16 grid md:grid-cols-3 gap-12">
        <div class="md:col-span-2">
          <h2 class="font-display font-semibold text-headline-lg text-primary mb-5">About this event</h2>
          <div id="ev-desc" class="font-sans text-body-lg text-on-surface-variant leading-relaxed space-y-4"></div>
          <div id="ev-video" class="mt-10"></div>
        </div>
        <aside class="rounded-xl border border-outline-variant bg-surface-container-lowest p-6 h-fit">
          <dl id="ev-facts" class="font-sans text-body-md space-y-4"></dl>
        </aside>
      </section>
    </article>
  </main>

  <!-- FOOTER (same as index.html) -->
  <div id="site-footer"></div>

  <script src="config.js"></script>
  <script src="nav.js?v=4.0.0"></script>
  <script src="api.js"></script>
  <script>
    function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function fmtDate(d, withTime) {
      if (!d) return 'Date TBD';
      const o = { weekday:'short', day:'numeric', month:'long', year:'numeric' };
      if (withTime) Object.assign(o, { hour:'numeric', minute:'2-digit' });
      return new Date(d).toLocaleString('en-SG', o);
    }
    function videoEmbedUrl(url) {
      if (!url) return null;
      const yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]+)/); if (yt) return `https://www.youtube.com/embed/${yt[1]}`;
      const vm = url.match(/vimeo\.com\/(\d+)/); if (vm) return `https://player.vimeo.com/video/${vm[1]}`;
      return null;
    }
    async function startCheckout(itemType, itemId, btn) {
      const original = btn.textContent; btn.disabled = true; btn.textContent = 'Redirecting to secure checkout…';
      try { await window.api.checkout(itemType, itemId); }
      catch (err) { alert(err.message || 'Could not start checkout. Please try again.'); btn.disabled = false; btn.textContent = original; }
    }
    function fact(label, value) { return value ? `<div><dt class="text-label-sm uppercase tracking-widest text-secondary font-bold mb-1">${label}</dt><dd class="text-on-surface">${value}</dd></div>` : ''; }

    (async function () {
      const q = new URLSearchParams(location.search);
      const key = q.get('id') || q.get('slug') || location.pathname.split('/events/')[1];
      const show = id => { ['ev-loading','ev-missing','ev'].forEach(x => document.getElementById(x).classList.toggle('hidden', x !== id)); };
      if (!key) return show('ev-missing');
      let e = null;
      try { const r = await fetch('/api/events/' + encodeURIComponent(key)); if (r.ok) e = (await r.json()).event; } catch (err) {}
      if (!e) return show('ev-missing');

      document.title = `${e.title} | BANAHUB Events`;
      const md = document.querySelector('meta[name="description"]'); if (md) md.content = (e.description || e.title).slice(0, 160);
      document.getElementById('ev-eyebrow').textContent = `${(e.type || 'Event').toUpperCase()} · ${(e.format || 'In-Person').toUpperCase()}${e.published === false ? ' · DRAFT PREVIEW' : ''}`;
      document.getElementById('ev-title').textContent = e.title;
      document.getElementById('ev-when').textContent = `${e.location || 'Location TBD'} · ${fmtDate(e.event_date)}`;
      if (e.cover_image) { const c = document.getElementById('ev-cover'); c.src = e.cover_image; c.classList.remove('hidden'); }
      document.getElementById('ev-desc').innerHTML = (e.description || 'Details coming soon.').split(/\n\s*\n/).map(p => `<p>${esc(p).replace(/\n/g,'<br/>')}</p>`).join('');

      const emb = videoEmbedUrl(e.video_url);
      if (e.video_url) document.getElementById('ev-video').innerHTML = emb
        ? `<div class="rounded-lg overflow-hidden" style="aspect-ratio:16/9"><iframe src="${esc(emb)}" class="w-full h-full" frameborder="0" allowfullscreen></iframe></div>`
        : `<video src="${esc(e.video_url)}" controls class="rounded-lg w-full"></video>`;

      const btn = 'bg-secondary-container text-on-surface px-6 py-3 rounded font-sans font-semibold text-body-md hover:opacity-90 transition-opacity';
      let cta = '';
      if (e.invite_only) cta = `<a href="mailto:hello@banahub.com?subject=${encodeURIComponent('Invite request: '+e.title)}" class="${btn}">Invite Only — Request Access</a>`;
      else if (e.luma_url) cta = `<a href="${esc(e.luma_url)}" target="_blank" rel="noopener" class="${btn}">RSVP on Luma</a>`;
      else if (e.price_amount > 0) cta = `<button onclick="startCheckout('event','${esc(e.id)}',this)" class="${btn}">Register — ${esc(e.currency||'SGD')} $${Number(e.price_amount).toLocaleString()}</button>`;
      else if (e.registration_url) cta = `<a href="${esc(e.registration_url)}" target="_blank" rel="noopener" class="${btn}">Register</a>`;
      cta += `<a href="mailto:hello@banahub.com?subject=${encodeURIComponent('Enquiry: '+e.title)}" class="border border-white/40 text-white px-6 py-3 rounded font-sans font-semibold text-body-md hover:bg-white/10 transition-colors">Enquire</a>`;
      document.getElementById('ev-cta').innerHTML = cta;

      document.getElementById('ev-facts').innerHTML =
        fact('Date', esc(fmtDate(e.event_date, true)) + (e.end_date ? `<br/><span class="text-on-surface-variant">to ${esc(fmtDate(e.end_date, true))}</span>` : '')) +
        fact('Location', esc(e.location || 'TBD')) +
        fact('Format', esc(e.format || '')) +
        fact('Capacity', e.capacity ? esc(e.capacity) + ' seats' : '') +
        fact('Admission', e.price_amount > 0 ? `${esc(e.currency||'SGD')} $${Number(e.price_amount).toLocaleString()}` : (e.invite_only ? 'By invitation' : 'Complimentary'));
      show('ev');
    })();
  </script>
</body>
</html>
