<!DOCTYPE html>
<html lang="en" class="light">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="BANAHUB Programs — cohort-based acceleration, GTM advisory, and cross-border expansion programs for founders, SMEs, and startups." />
  <meta property="og:title" content="Programs | BANAHUB" />
  <meta property="og:description" content="Cohort-based acceleration and expansion programs." />
  <meta property="og:url" content="https://www.BANAHUB.com/programs.html" />
  <meta property="og:type" content="website" />
  <link rel="canonical" href="https://www.banahub.com/programs"/>
  <title>Programmes | BANAHUB</title>

  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="512x512" href="logo-icon-512.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <link rel="stylesheet" href="./output.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Manrope:wght@300;400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@400,0&display=swap"
    rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Manrope', system-ui, sans-serif; }
    .glass { background: rgba(250,249,245,.72); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(191,201,195,.3); }
    .font-display { font-family: 'Newsreader', Georgia, serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
    .pg-card { transition: transform .2s ease, box-shadow .2s ease; }
    .pg-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,53,39,.12); }
    /* Glass status badges */
    .badge-glass { background: #fff; border: 1px solid rgba(191,201,195,0.4); }
  </style>
</head>

<body class="bg-background text-on-surface antialiased">

  <!-- NAV -->
  <div id="site-nav"></div>

  <main>

    <!-- HERO -->
    <section class="relative py-20 px-10 max-w-container-max mx-auto text-center">
      <p class="font-sans font-bold text-label-caps text-secondary tracking-widest mb-4">PROGRAMMES</p>
      <h1 class="font-display font-semibold text-display-md text-primary max-w-3xl mx-auto leading-tight">Programmes</h1>
      <p class="font-sans text-body-lg text-on-surface-variant mt-5 max-w-xl mx-auto">
        Structured programmes for growth-stage companies and SMEs: market entry, go-to-market and capital readiness, delivered with partner organisations.
      </p>
    </section>

    <!-- FILTER -->
    <section class="px-10 max-w-container-max mx-auto mb-6 flex flex-wrap gap-2" id="status-filters">
      <button data-status="" class="pg-filter-btn bg-primary text-on-primary px-4 py-1.5 rounded-full font-sans text-body-sm font-semibold">All</button>
      <button data-status="active" class="pg-filter-btn badge-glass text-on-surface px-4 py-1.5 rounded-full font-sans text-body-sm font-semibold">Active</button>
      <button data-status="upcoming" class="pg-filter-btn badge-glass text-on-surface px-4 py-1.5 rounded-full font-sans text-body-sm font-semibold">Upcoming</button>
      <button data-status="closed" class="pg-filter-btn badge-glass text-on-surface px-4 py-1.5 rounded-full font-sans text-body-sm font-semibold">Closed</button>
    </section>

    <!-- PROGRAMS GRID -->
    <section class="px-10 max-w-container-max mx-auto pb-24">
      <div id="programs-grid" class="grid grid-cols-1 md:grid-cols-3 gap-8">
        <div class="col-span-full text-center py-16 text-on-surface-variant font-sans">Loading programmes…</div>
      </div>
    </section>

  </main>

  <!-- FOOTER -->
  <div id="site-footer"></div>

  <script src="config.js"></script>
  <script src="nav.js?v=4.2.0"></script>
  <script src="api.js"></script>
  <script>

    function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function fmtDate(d) { if(!d) return 'Date TBD'; return new Date(d).toLocaleDateString('en-SG',{day:'numeric',month:'short',year:'numeric'}); }

    let allPrograms = [];
    function statusColor(s) {
      return s === 'active' ? 'bg-primary text-on-primary' : s === 'upcoming' ? 'bg-secondary-container text-on-surface' : 'bg-outline-variant/40 text-on-surface-variant';
    }

    function programCard(p) {
      return `
        <div id="program-${esc(p.id)}" class="pg-card rounded-xl overflow-hidden border border-outline-variant bg-surface-container-lowest p-6" style="scroll-margin-top:96px">
          <div class="flex items-center justify-between mb-4">
            <span class="px-3 py-1 rounded-full text-body-sm font-sans font-semibold ${statusColor(p.status)}">${esc((p.status||'draft').toUpperCase())}</span>
            <span class="material-symbols-outlined text-primary opacity-70">${p.type==='Cohort'?'groups':p.type==='Summit'?'account_balance':'forum'}</span>
          </div>
          <h3 class="font-display font-semibold text-headline-sm text-primary mb-2">${esc(p.title)}</h3>
          <p class="font-sans text-body-sm text-on-surface-variant mb-3 line-clamp-3">${esc(p.description || '')}</p>
          <p class="font-sans text-body-sm text-on-surface-variant mb-1">${esc(p.region || 'Region TBD')}</p>
          <p class="font-sans text-body-sm text-primary mb-4">${fmtDate(p.start_date)}${p.end_date?' – '+fmtDate(p.end_date):''}</p>
          ${p.max_participants ? `<p class="font-sans text-body-sm text-on-surface-variant mb-2">Max ${p.max_participants} participants</p>` : ''}
          <p class="font-sans text-headline-sm font-display text-primary mb-4">${p.price_amount > 0 ? `${esc(p.currency||'SGD')} $${Number(p.price_amount).toLocaleString()}` : 'Free'}</p>
          ${p.price_amount > 0
            ? `<button onclick="startCheckout('program','${p.id}',this)" class="w-full bg-primary text-on-primary px-4 py-2.5 rounded font-sans font-semibold text-body-md hover:bg-primary-container transition-colors">Enrol</button>`
            : `<a href="program-register.html?program=${encodeURIComponent(p.title)}" class="block text-center bg-primary text-on-primary px-4 py-2.5 rounded font-sans font-semibold text-body-md hover:bg-primary-container transition-colors">Apply to Participate</a>`}
        </div>`;
    }

    function renderGrid(status) {
      const grid = document.getElementById('programs-grid');
      const filtered = status ? allPrograms.filter(p => p.status === status) : allPrograms;
      grid.innerHTML = filtered.length
        ? filtered.map(programCard).join('')
        : `<div class="col-span-full text-center py-16 text-on-surface-variant font-sans">No programs in this category yet.</div>`;
    }

    document.querySelectorAll('.pg-filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.pg-filter-btn').forEach(b => {
          b.className = 'pg-filter-btn badge-glass text-on-surface px-4 py-1.5 rounded-full font-sans text-body-sm font-semibold';
        });
        btn.className = 'pg-filter-btn bg-primary text-on-primary px-4 py-1.5 rounded-full font-sans text-body-sm font-semibold';
        renderGrid(btn.dataset.status);
      });
    });

    async function startCheckout(itemType, itemId, btn) {
      const original = btn.textContent;
      btn.disabled = true; btn.textContent = 'Redirecting to secure checkout…';
      try {
        await window.api.checkout(itemType, itemId);
      } catch (err) {
        alert(err.message || 'Could not start checkout. Please try again.');
        btn.disabled = false; btn.textContent = original;
      }
    }

    async function loadPrograms() {
      const grid = document.getElementById('programs-grid');
      try {
        const res = await window.api.getPrograms();
        allPrograms = (res && res.programs) || [];
        renderGrid('');
        if (location.hash.startsWith('#program-')) {
          const el = document.getElementById(location.hash.slice(1));
          if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); el.style.boxShadow = '0 0 0 3px #003527'; }
        }
      } catch (err) {
        console.warn('loadPrograms failed', err);
        grid.innerHTML = `<div class="col-span-full text-center py-16 text-on-surface-variant font-sans">Could not load programs right now.</div>`;
      }
    }

    loadPrograms();
  </script>
</body>
</html>
