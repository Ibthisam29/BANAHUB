<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reset Password | BANAHub</title>
<link rel="icon" type="image/x-icon" href="favicon.ico" />
<link rel="icon" type="image/png" sizes="512x512" href="logo-icon-512.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="stylesheet" href="./output.css"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Manrope:wght@300;400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@400,0&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;}
body{font-family:'Manrope',system-ui,sans-serif;}
.font-display{font-family:'Newsreader',Georgia,serif;}
.ivory-texture{background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23000' fill-opacity='.012' fill-rule='evenodd'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E");}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.anim-up{animation:fadeUp 0.4s ease-out forwards;}
</style>
</head>
<body class="min-h-screen bg-background ivory-texture antialiased">

<div class="min-h-screen flex items-center justify-center p-8">
  <div class="w-full max-w-sm anim-up">

    <a href="index.html" class="block font-display font-semibold text-xl text-primary mb-10 text-center">BANAHub</a>

    <div id="request-view">
      <span class="block font-sans font-bold text-xs text-on-surface-variant tracking-[0.15em] uppercase mb-2 text-center">Institutional Access</span>
      <h1 class="font-display font-semibold text-3xl text-primary mb-3 text-center">Reset your password</h1>
      <p class="font-sans text-sm text-on-surface-variant text-center mb-8">Enter your email and we'll send you a reset link.</p>

      <div id="error-msg" class="hidden mb-5 px-4 py-3 bg-red-50 border border-red-200 rounded text-sm font-sans text-red-700"></div>

      <form id="request-form" onsubmit="handleRequest(event)" class="flex flex-col gap-5">
        <div>
          <label class="block font-sans font-bold text-xs text-on-surface-variant tracking-widest uppercase mb-2">Email Address</label>
          <input id="email" type="email" required placeholder="name@institution.com"
            class="w-full border border-outline-variant rounded px-3 py-2.5 font-sans text-sm text-on-surface bg-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/20 transition-all"/>
        </div>
        <button type="submit" id="submit-btn"
          class="bg-primary text-white w-full py-3 rounded font-sans font-semibold text-sm hover:bg-primary-container transition-colors mt-1 flex items-center justify-center gap-2">
          <span id="btn-text">Send Reset Link</span>
          <span id="btn-spinner" class="hidden material-symbols-outlined text-[18px] animate-spin">progress_activity</span>
        </button>
      </form>
    </div>

    <div id="sent-view" class="hidden text-center">
      <span class="material-symbols-outlined text-5xl text-primary">mark_email_read</span>
      <h1 class="font-display font-semibold text-2xl text-primary mt-4 mb-2">Check your email</h1>
      <p class="font-sans text-sm text-on-surface-variant">If an account exists for that address, a reset link is on its way. It can take a minute or two — check spam if it doesn't show up.</p>
    </div>

    <p class="font-sans text-sm text-on-surface-variant text-center mt-6">
      <a href="login.html" class="text-primary font-semibold hover:underline">Back to login</a>
    </p>
  </div>
</div>

<script src="config.js"></script>
<script>
async function handleRequest(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const btn = document.getElementById('submit-btn');
  const btnText = document.getElementById('btn-text');
  const spinner = document.getElementById('btn-spinner');
  const errBox = document.getElementById('error-msg');
  errBox.classList.add('hidden');
  btn.disabled = true; btnText.textContent = 'Sending…'; spinner.classList.remove('hidden');

  try {
    const sb = await window.getBanaSupabaseClient();
    if (!sb) throw new Error('Could not connect. Try again in a moment.');
    // redirectTo must be added to Supabase → Authentication → URL
    // Configuration → Redirect URLs, or Supabase will reject/ignore it.
    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/reset-password-confirm.html',
    });
    if (error) throw error;
    document.getElementById('request-view').classList.add('hidden');
    document.getElementById('sent-view').classList.remove('hidden');
  } catch (err) {
    errBox.textContent = err.message || 'Could not send reset link. Please try again.';
    errBox.classList.remove('hidden');
    btn.disabled = false; btnText.textContent = 'Send Reset Link'; spinner.classList.add('hidden');
  }
}
</script>
</body>
</html>
